name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Advisory until the existing backlog is cleared (0.3.1: ruff 36 findings,
  # 49 files unformatted). `continue-on-error` keeps the job visible as a
  # failure in the run summary instead of hiding it behind `|| true`.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Ruff format check
        run: uvx ruff format --check .
      - name: Ruff lint
        run: uvx ruff check .

  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv pip install --system -e ".[dev,mcp]"
      - name: mypy --strict
        run: mypy sillok/

  # Gating. Before 0.3.1 every step ended in `|| true`, so the job was green
  # while three tests failed on main.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv pip install --system -e ".[dev,mcp]"
      - name: pytest
        run: python -m pytest --cov=sillok
