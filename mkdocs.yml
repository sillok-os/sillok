site_name: Sillok
site_description: "Productized LLM Wiki pattern + typed pack registry + proposal-only governance"
site_url: https://sillok-os.github.io/sillok/
repo_url: https://github.com/sillok-os/sillok
repo_name: sillok-os/sillok
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Peter Kim and Sillok contributors. Apache License 2.0.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Internal meta-audit kept in the repo for history; not part of the docs site.
exclude_docs: |
  architecture/coverage-vs-aipm-vault.md

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/README.md
      - Framework coverage: architecture/framework-coverage.md
      - Proposal-only governance: architecture/proposal-only-governance.md
      - Frontmatter compatibility: architecture/frontmatter-compatibility.md
  - Modules: modules/index.md
  - Integrations:
      - MCP quickstart: integrations/mcp-quickstart.md
      - Claude Code install prompt: integrations/claude-code-install-prompt.md
  - Tutorials: tutorials/index.md
  - Recipes:
      - recipes/index.md
      - Search a vault with bongsu: recipes/search-vault-with-bongsu.md
      - Decide reusability with yeonryun: recipes/decide-reusability-with-yeonryun.md
  - Eval:
      - Probe set: eval/probe-set.md
  - Governance: governance/index.md
  - Benchmarks: benchmarks/index.md
  - Contributing:
      - Extending with your domain: contributing/extending-with-your-domain.md
  - API Reference: api/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sillok-os
